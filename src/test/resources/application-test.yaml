spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL # H2 em memória, compatível com PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop # Cria schema antes de cada teste e deleta depois
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.example: DEBUG